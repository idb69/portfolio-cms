spring.application.name=portfolio-cms

server.port=8080


# ===============================
# DATABASE
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_cms?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password="Password"

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# FILE UPLOAD
# ===============================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload-dir=${UPLOAD_DIR:uploads}


# ===============================
# JWT
# ===============================

app.jwt.secret=${JWT_SECRET:MyPortfolioCmsSecretKey2026VeryLongAndSecure123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# ===============================
# MAIL
# ===============================

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:admin}
spring.mail.password=${MAIL_PASSWORD:admin123}


# ===============================
# ADMIN
# ===============================

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}